<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kviz: Varnost otrok pred neznanci | Akademija varnosti AKAB</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --bg: #fdfbf7;
    --bg-card: #ffffff;
    --ink: #1c1a17;
    --muted: #5a544c;
    --crimson: #9a1b2f;
    --crimson-dark: #6e1220;
    --gold: #b8923c;
    --gold-light: #e8d9ae;
    --border: #e6ded0;
    --green: #3f7d4f;
    --green-bg: #eaf3ec;
    --red-bg: #f8eaea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Barlow', sans-serif;
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, var(--crimson-dark), var(--crimson));
    padding: 44px 20px 40px;
    text-align: center;
    color: #fff;
  }

  header img.logo {
    width: 110px;
    height: auto;
    margin-bottom: 18px;
  }

  header .eyebrow {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--gold-light);
    margin-bottom: 10px;
  }

  header h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 38px);
    margin: 0;
  }

  header p.lead {
    max-width: 600px;
    margin: 16px auto 0;
    color: #f1e6e6;
    font-size: 15.5px;
  }

  main {
    max-width: 700px;
    margin: -28px auto 60px;
    padding: 0 20px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px clamp(20px, 5vw, 40px);
    box-shadow: 0 12px 30px rgba(30,20,10,0.08);
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 26px;
  }
  .progress-fill {
    height: 100%;
    background: var(--crimson);
    transition: width .3s ease;
    width: 0%;
  }

  .qtext {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 20px;
    color: var(--ink);
  }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .opt {
    text-align: left;
    background: #fbf9f4;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 15.5px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-family: 'Barlow', sans-serif;
  }
  .opt:hover:not(:disabled) { border-color: var(--gold); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--green-bg); border-color: var(--green); }
  .opt.wrong { background: var(--red-bg); border-color: var(--crimson); }

  .explain {
    margin-top: 20px;
    background: #fbf3e4;
    border-left: 4px solid var(--gold);
    padding: 14px 18px;
    border-radius: 6px;
    font-size: 14.5px;
    color: var(--muted);
    display: none;
  }
  .explain.show { display: block; }

  .next-btn {
    margin-top: 22px;
    background: linear-gradient(135deg, var(--crimson-dark), var(--crimson));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 20px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    width: 100%;
    cursor: pointer;
    display: none;
  }
  .next-btn.show { display: block; }

  .result-title {
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--crimson-dark);
    margin: 0 0 10px;
  }
  .result-score {
    font-size: 40px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    color: var(--crimson);
    margin: 6px 0 14px;
  }
  .result-band {
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 22px;
  }
  .restart-btn {
    background: transparent;
    border: 2px solid var(--crimson);
    color: var(--crimson);
    border-radius: 10px;
    padding: 12px 20px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
  }

  footer {
    text-align: center;
    padding: 20px 20px 50px;
    color: var(--muted);
    font-size: 13px;
  }
  footer .brand {
    font-family: 'Oswald', sans-serif;
    color: var(--crimson-dark);
    font-weight: 600;
    letter-spacing: 1px;
  }
  .back-link {
    display: inline-block;
    margin-top: 8px;
    color: var(--crimson);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>

    explain: "Grooming običajno poteka postopoma — z izbiranjem 'posebnega' otroka, stopnjevanjem pozornosti in daril ter postopnim rušenjem mej."
  },
  {
    q: "Otroka v avtomobilu neznanec vpraša za pot. Kaj je pravilen odziv?",
    options: [
      "Otrok se približa oknu avtomobila, da bolje razloži pot",
      "Otrok ostane na varni razdalji od vozila in po potrebi glasno pokliče pomoč",
      "Otrok vstopi v avto, da pokaže smer",
      "Otrok ne odgovori nič in obstane na mestu"
    ],
    correct: 1,
    explain: "'Spraševanje po smeri' je znan trik za približevanje otroku. Varna razdalja od vozila je ključna — odrasli od otrok ne potrebujejo pomoči pri poti."
  },
  {
    q: "Kaj naj otrok stori, če ga nekdo prime za roko in poskuša odpeljati, mimoidoči pa tega ne opazijo?",

      "Glasno zavpije jasno sporočilo, npr. 'Ti nisi moj oče/mama!', da opozori okolico",

    ],
    correct: 1,

  {

      "Samo, če to najprej dovolijo starši po telefonu",
      "Samo ob poškodbah, nikoli ob nevarnosti s strani osebe"
    ],
    correct: 1,
    explain: "Osnovno znanje klica v sili je ena od ključnih strategij — otrok mora vedeti, da lahko v resnični nevarnosti to stori sam, brez čakanja na dovoljenje."

  {
    q: "Kaj od naštetega NI eden od pogostih trikov za pridobivanje zaupanja otrok?",
    options: [
      "Ponujanje sladkarij ali daril",
      "Zgodba o družinski nujnosti ('tvoj starš je poškodovan')",

    ],
    correct: 3,
    explain: "Pristni, zaupanja vredni odrasli se navadno lahko preverijo (ime, kontakt staršev) — medtem ko so sladkarije, izmišljene nujnosti in spletno izpraševanje o otroku klasični trikovi manipulacije."

    explain: "Učinkovita zaščita temelji na prepoznavanju konkretnega vedenja in zaupanju v lasten občutek nelagodja — ne na strahu pred vsemi ljudmi ali eni sami opozorilni frazi."

let current = 0;
let score = 0;
let answered = false;

const qtext = document.getElementById('qtext');
const optionsEl = document.getElementById('options');
const explainEl = document.getElementById('explain');
const nextBtn = document.getElementById('nextBtn');
const qcounter = document.getElementById('qcounter');
const scorecounter = document.getElementById('scorecounter');
const progressFill = document.getElementById('progressFill');
const quizArea = document.getElementById('quiz-area');
const resultArea = document.getElementById('result-area');

function loadQuestion() {
  answered = false;
  const item = questions[current];
  qtext.textContent = item.q;
  optionsEl.innerHTML = '';
  explainEl.classList.remove('show');
  explainEl.textContent = '';
  nextBtn.classList.remove('show');
  qcounter.textContent = `Vprašanje ${current + 1} / ${questions.length}`;
  scorecounter.textContent = `Točke: ${score}`;
  progressFill.style.width = `${(current / questions.length) * 100}%`;

  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const btns = optionsEl.querySelectorAll('.opt');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === item.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === item.correct) score++;
  scorecounter.textContent = `Točke: ${score}`;
  explainEl.textContent = item.explain;
  explainEl.classList.add('show');
  nextBtn.classList.add('show');
  nextBtn.textContent = current === questions.length - 1 ? 'Poglej rezultat →' : 'Naslednje vprašanje →';
}

nextBtn.addEventListener('click', () => {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
});

function showResult() {
  quizArea.style.display = 'none';
  resultArea.style.display = 'block';
  document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
  let band;
  if (score <= 7) band = 'Začetnik — priporočamo, da si podrobneje ogledaš gradivo o varnosti otrok.';
  else if (score <= 11) band = 'Dobro osnovno znanje — nekaj ključnih konceptov je vredno še utrditi.';
  else if (score <= 13) band = 'Zelo dobro znanje — dobro poznaš sodobne pristope k zaščiti otrok.';
  else band = 'Odlično! Odlično poznaš sodobne, strokovno podprte pristope k zaščiti otrok.';
  document.getElementById('resultBand').textContent = band;
}

document.getElementById('restartBtn').addEventListener('click', () => {
  current = 0;
  score = 0;
  resultArea.style.display = 'none';
  quizArea.style.display = 'block';
  loadQuestion();
});

loadQuestion();
</script>
